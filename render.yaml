services:
  - type: worker
    name: telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TMLOG_API_URL
        value: "https://tmlogbot.com/api"
      - key: TMLOG_LOGIN
        sync: false
      - key: TMLOG_PASS
        sync: false
