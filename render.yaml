services:
  - type: background_worker
    name: telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TTM_API_URL
        value: "https://enginesearch.top"
      - key: TTM_TOKEN
        sync: false
