services:
  - type: background_worker
    name: telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TMLOG_BOT_USERNAME
        value: "tmlogbot"
      - key: TMLOG_CHAT_ID
        sync: false
      - key: LOGIN_PASS
        value: "login:pass"
