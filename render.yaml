services:
  - type: web
    name: telegram-automation
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TARGET_BOT_USERNAME
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: DOWNLOAD_DIR
        value: "./downloads"
      - key: RESULT_DIR
        value: "./results"
      - key: DB_PATH
        value: "./data/queue.db"
      - key: MAX_RETRIES
        value: "3"
      - key: BOT_RESPONSE_TIMEOUT
        value: "60"
      - key: FILE_TIMEOUT
        value: "180"
    healthCheckPath: /health
